services:
  - type: web
    name: emstrap-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: EMERGENCY_MONGODB_URI
        value: mongodb+srv://emstrapcontacts_db_user:Emstr%40p@cluster0.da9nevi.mongodb.net/EMSTRAP-Emergency?retryWrites=true&w=majority
      - key: BOOKING_MONGODB_URI
        value: mongodb+srv://emstrapcontacts_db_user:Emstr%40p@cluster0.da9nevi.mongodb.net/EMSTRAP-Booking?retryWrites=true&w=majority
      - key: CLIENT_ORIGIN
        value: https://emstrap-frontend-utuo.onrender.com,https://emstrap-user.onrender.com,https://emstrap-driver.onrender.com,https://emstrap-police.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        value: emstrapcontacts@gmail.com
      - key: SMTP_PASSWORD
        value: ykaagyudffzxgwda
      - key: EMAIL_FROM
        value: EmSTraP <emstrapcontacts@gmail.com>

  # 1. User Dashboard / Portal
  - type: web
    name: emstrap-user
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build:user
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://emstrap-backend-utuo.onrender.com/api

  # 2. Driver Dashboard / Portal
  - type: web
    name: emstrap-driver
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build:driver
    staticPublishPath: frontend/dist-driver
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://emstrap-backend-utuo.onrender.com/api

  # 3. Police Command / Dashboard
  - type: web
    name: emstrap-police
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build:police
    staticPublishPath: frontend/dist-police
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://emstrap-backend-utuo.onrender.com/api
