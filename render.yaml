services:
  - type: web
    name: emstrap-backend
    env: node
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://emstrap-backend.onrender.com

  - type: static
    name: emstrap-frontend
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_API_BASE
        value: https://emstrap-backend.onrender.com
