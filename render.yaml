services:
  - type: web
    name: emstrap-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: EMERGENCY_MONGODB_URI
        value: mongodb+srv://emstrapcontacts_db_user:Emstr%40p@cluster0.da9nevi.mongodb.net/EMSTRAP-Emergency?retryWrites=true&w=majority
      - key: BOOKING_MONGODB_URI
        value: mongodb+srv://emstrapcontacts_db_user:Emstr%40p@cluster0.da9nevi.mongodb.net/EMSTRAP-Booking?retryWrites=true&w=majority
      - key: CLIENT_ORIGIN
        value: https://emstrap-frontend.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: SMTP_USER
        value: emstrapcontacts@gmail.com
      - key: SMTP_PASSWORD
        value: ykaagyudffzxgwda
      - key: EMAIL_FROM
        value: EmSTraP <emstrapcontacts@gmail.com>

  - type: web
    name: emstrap-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://emstrap-backend.onrender.com/api
